[package]
name = "passport-os"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PassportOS firmware for FoloToy AI Passport (ESP32-C3)"
publish = false

[[bin]]
name = "passport-os"
path = "src/main.rs"

[dependencies]
passport-core = { path = "../crates/passport-core" }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-futures = "0.1"
embassy-sync = "0.8"
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3", "unstable"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3", "embassy", "esp-radio"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3", "wifi", "ble", "unstable"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = ["esp32c3"] }
heapless = { workspace = true }
embedded-io-async = "0.6"
embedded-hal = "1.0"
nb = "1"
# `#[gatt_server]` output stores the server in a StaticCell.
static_cell = "2.1.0"
trouble-host = { version = "0.7.0", features = ["default-packet-pool-mtu-255", "derive"] }
